name: Release

on:
  push:
    branches: [main]

# Scoped per job rather than here: validate only reads, and it is the job that
# runs the most third-party code.
permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  # The shared workflow cuts nothing when main has moved past this run's
  # commit, and leaves the release to the newer push's run. Tagging the older
  # commit would be refused with a 403 whenever that push changed a workflow
  # file, because GITHUB_TOKEN holds no workflows permission.
  release:
    needs: validate
    uses: datapointchris/reusable-workflows/.github/workflows/go-semantic-release.yml@v1
    permissions:
      contents: write
    with:
      goreleaser: true
