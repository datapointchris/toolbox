version: 2

builds:
  - main: .
    binary: toolbox
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.buildVersion={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "toolbox_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

changelog:
  sort: asc
